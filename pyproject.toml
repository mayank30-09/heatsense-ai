[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatsense-ai"
version = "0.1.0"
description = "HEATSENSE AI urban heat analysis and mitigation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "geoalchemy2>=0.17,<1.0",
  "geopandas>=1.0,<2.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "rasterio>=1.3,<2.0",
  "earthengine-api>=1.6,<2.0",
  "rio-tiler>=9.0,<10.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = [
    "integration: tests requiring external services such as PostgreSQL",
]

[tool.setuptools.packages.find]
include = ["backend*"]