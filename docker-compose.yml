services:
  db:
    image: postgis/postgis:16-3.4
    container_name: heatsense-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heatsense}
      POSTGRES_USER: ${POSTGRES_USER:-heatsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatsense_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heatsense} -d ${POSTGRES_DB:-heatsense}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
